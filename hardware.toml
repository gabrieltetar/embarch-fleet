# The bench, as the owner knows it. The half of the hardware topology that
# cannot be measured.
#
# `scripts/fleet-hardware.py --refresh` merges three things -- this file, the
# machine-local overlay beside it (below), and what Core reports live -- and
# writes `<state_dir>/hardware.json`, which is what a leg reads. Reasons for the
# split:
#
#   * **A leg must not have to re-derive the bench.** Before this file, the
#     bench's facts lived in prose inside one task (`tasks/api/029`), so every
#     agent that touched hardware re-read a task file to learn the console pins
#     — and any agent that did not read that one task did not know them at all.
#   * **Measured and stated must stay distinguishable.** Core measures a
#     hardware ID over the debug probe; nothing measures which PPG AFE is on
#     the board. `hardware.json` tags every field with which of the two it is,
#     because the failure this suite keeps hitting is a stated fact read as a
#     measured one.
#
# **Nothing that names a client belongs in this file.** Product names, repo
# names and the workspace paths that contain them go in
# `<state_dir>/hardware-local.toml`, which is outside every repo — the same
# reason the client-name denylist lives there and not in a repo, per
# `fleet.toml`'s `client_denylist`: a committed record of the names you are
# hiding is the leak it exists to prevent. `check-client-names.py` is what
# catches a slip, and it caught one writing this file.
#
# Owner-reserved, like everything in this repo. A leg never checks it out and
# never edits it; it reads the rendered JSON.

# One block per enrolled role. `role` is the string `validate` takes.
[[roles]]
role = "dev-bench"
board = "nrf54l15dk/nrf54l15/cpuapp"
description = "EmbArch's own test rig. An nRF54L15DK again as of 2026-08-31."
# COM17/VCOM1. Interface 2 is the HIGHER of the two the DK exposes, not the
# lowest — enrolled with link_port_interface = 2, and getting this wrong is a
# silent wrong-port attach rather than an error.
link_port = "COM17"
link_port_interface = 2

[[roles]]
role = "dut"
board = "nff_dev"
revision = 6
description = "The client wearable under test. rev6 carries the AS7058 PPG AFE; rev7 the MAX86178."
# Console, either revision. Needs a physical UART wire — it is not the J-Link
# VCOM, so `serial-log` has no port configured for this project on purpose.
console_uart = "uart20"
console_tx = "P1.05"
console_rx = "P1.04"

# How this DUT's BLE identity relates to its enrolled hardware ID. Stated, not
# measured: it is read off the client firmware's own advertising code, which is
# evidence about intent, not an observation of this board.
#
# That firmware advertises a local name ending in `%02X%02X` of
# `hwinfo_get_device_id()` bytes 6 and 7, and puts those same two bytes,
# unswapped and in the same order, in a manufacturer-data element of the
# PRIMARY advert — its own comment says the point is that "an operator reads
# the same digits either way".
#
# So a join between "an advertiser on the air" and "a probe enrolled by
# hardware ID" does exist for this DUT family, which is the thing every bench
# task so far has recorded as impossible. What blocks it is on EmbArch's side:
# `report_scan_seen()` in embarch-dev-bench logs address, connectability and
# name, and NOT the manufacturer data. Until it does, the join has to be made
# by hand and confirmed by connecting.
#
# The name prefix itself is a client product name, so it lives in the local
# overlay as `dut_ble.name_template`. Without the overlay this section still
# yields the suffix candidates, which are the half that carries the argument.
[dut_ble]
# Which bytes of the enrolled hardware ID become the 4-digit suffix. Both
# candidates are computed because Core's hardware-ID byte order and the chip's
# own `hwinfo` order are known to disagree on at least one path: dev-bench
# reads `6fcddc36cb781b71` over JTAG and self-reports `cb781b716fcddc36`, the
# 32-bit-word-swapped form. Neither candidate has been confirmed on air.
suffix_from_hardware_id_bytes = [6, 7]
confirmed_on_air = false

# DUT-side sequence facts. Owner-supplied, each one paid for by a failed run.
# A study that skips one of these does not fail cleanly.
[lore]
ble_speed_fast = "Send `ble speed fast` over NUS before any BDS step. The DUT's HCI 0x08 failures are its own slow connection interval; without it a study dies around step 5, with it 14 of 14 pass."
meas_sched_stop = "`meas_sched stop` before `hrm_start`, or `hrm_start` races the measurement scheduler and returns ERR_PERMISSION on roughly a 120 s coin flip."
config_log_off = "CONFIG_LOG off for BDS runs, or the warning storm drops BDS data. The outpost snippet already compiles it out, so NUS `log ...` returns 'command not found' — expected, not a fault."
flash_what_is_built = "Flash what is already built. Do not `west build` the client workspace; if no artifact exists, say so and stop."
never_probe_rs = "Never flash Nordic RRAM parts with probe-rs. Core picks the board's declared vendor runner per chip family; let it."
