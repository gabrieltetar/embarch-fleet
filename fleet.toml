# The instance. Everything machine- or suite-specific the fleet needs, in one
# file, so the rest of this repo is the framework and this is the only thing a
# second machine edits.
#
# Copy this to a new checkout, change these values, run
# `scripts/install.py <doc-repo>`, and the fleet is stood up. Nothing else in
# this repo names a path, a channel or a person.

[fleet]
# Everything lives under here: the repos, the `.fleet/` state directory, and
# the `.worktrees/` root workers and legs are created in. Absolute.
root = "/home/gabriel/Github/embarch"

# The instance repo, relative to root. Holds the queue (`tasks/`, `inbox/`,
# `status.d/`, `changelog.d/`) and the docs the queue is a view of. This is the
# repo a leg's cwd is, and the one `install.py` writes `.claude/` into.
doc_repo = "embarch-doc"

# Where the pump latch, the tick file and the alert webhook live. Outside every
# repo on purpose: the webhook is a secret and the latch must not be committed.
state_dir = ".fleet"

# Worktree root, relative to root. Outside every repo tree -- never inside
# `.claude/worktrees/`, which is what made a naive source scan find six GATT
# service blocks instead of three (embarch-study-designer decision 57).
worktree_root = ".worktrees"

# The client-name denylist check-client-names.py reads, relative to state_dir
# (absolute is honoured). It is outside every repo because a committed list of
# the names you are hiding is the leak it exists to prevent -- see that script's
# header, and open.md's "Whether the framework's prose is portable".
client_denylist = "client-names"

[slack]
# The control plane. See ops.md §5.
channel = "C0BUKTL2FPC"
channel_name = "#embarch-fleet"

# The one identity whose messages are instructions. ops.md §5.3: the connector
# authenticates as this user, so the fleet's own posts are authored by it too --
# which is why `robot_face` is load-bearing.
owner = "U0AGQGSHM2P"

# Where cloud sessions go. Never invite @Claude to the fleet channel.
cloud_channel = "C0C00CNS9KJ"

[limits]
# protocol.md §6: a leg is this many units, then it dies and hands off.
units_per_leg = 4

# ops.md §1: the concurrency cap. The budget's --suggest sets the actual wave
# size per leg; this is the ceiling it may not exceed.
max_workers = 6

# ops.md §2: wave size when the quota percentages are unavailable, which on
# this machine is the steady state.
degraded_workers = 2

# ops.md §2's two thresholds, deliberately different: the weekly one is a
# budget, the 5-hour one is a lockout that would stop the owner working too.
#
# **Both raised to 90 at the owner's call, 2026-09-07: full speed until 80%,
# taper 80->90, hard stop at 90.** `suggest()` already implements exactly that
# shape, so the policy is these two numbers and `taper` below rather than any
# code. What made it worth changing: `/usage` read weekly **76%** that evening,
# so the old 70 would have HELD the fleet outright while a fifth of the week's
# allowance was still unspent -- and nobody could see that, because the gate has
# never once had a percentage to read (see the ceiling note below).
weekly_pct = 90
five_hour_pct = 90

# The width of the slow-down zone, as a fraction of a cap: full width below
# `(1 - taper) * cap`, then linear to one worker AT the cap. 0.111 * 90 = 10
# points, so full width below 80% and a taper from there to the hard stop.
#
# It was an argparse default of 0.25 and reachable from no config, which meant
# the band was 22.5 points wide and full width stopped at 67.5% -- a policy
# nobody had chosen, in a file nobody would look in.
taper = 0.111

# **Ignore the 5-hour window entirely when it resets within this many minutes**
# (owner's call, 2026-09-07). It is a lockout rather than a budget and it refills
# on a clock, so holding on it with minutes left buys nothing and costs the fleet
# those minutes -- the evening this was added it read 71% with 15 minutes to run.
# The exposure is bounded by the same clock that justifies the grace: ignoring it
# with N minutes to go risks at most an N-minute lockout, which is why it is a
# duration rather than a flag. **The weekly window is never graced** -- that one
# is the real budget and its reset is days away.
five_hour_grace_min = 60

# What the 5-hour window actually holds, in BILLABLE tokens -- input + output +
# cache writes, cache reads excluded because they bill at roughly a tenth.
#
# This exists because the percentages above are unavailable on this machine by
# construction (ops.md §2: `rate_limits` reaches only a status line, the VS Code
# extension runs none, and the field is recorded nowhere on disk). Without a
# number the fallback was a CONSTANT wave of `degraded_workers`, whatever the
# seat had left -- which is both too slow when the window is empty and too fast
# when it is nearly spent.
#
# CALIBRATED FROM OBSERVED BEHAVIOUR, not derived, measured 2026-09-07 over four
# days of transcripts bucketed into 5-hour windows aligned to a real 429's own
# reset boundary:
#
#   09-05 20:30   15.4M billable   3,830 requests   no 429
#   09-06 01:30   12.5M            2,461            no 429
#   09-06 11:30   10.2M            2,768            no 429
#   09-06 16:30   17.7M            5,177            *** 429 at 03:29Z ***
#   09-06 21:30   13.9M            2,702            no 429
#
# So the wall is between 15.4M and 17.7M. 16M is the conservative read of that,
# and being wrong costs a 5-hour lockout that stops the OWNER working, not just
# the fleet -- hence the low side of the bracket rather than the middle.
#
# **Raised to 22.6M on 2026-09-07, and the old bracket was measuring the wrong
# thing.** That evening `/usage` reported the session window **71% used** while
# this repo's own transcripts held **17.8M billable in that same window** -- above
# the 17.7M that produced the 429 above, with no 429 and a third of the window
# left. So the wall the bracket found was not window exhaustion: 17.8M at 71%
# implies an allowance near **25.1M**, and the 429 at 03:29Z was something else,
# most likely a burst rate rather than the five-hour total. A rolling sum is a
# coarse instrument for predicting a per-minute limit.
#
# 22.6M is 90% of that implied allowance -- the owner's hard stop, expressed in
# the only unit this fallback can read. **It is a proxy pinned to one real
# percentage, not a published limit**: `scripts/fleet-usage-reading.py` records
# each `/usage` reading against the burn measured from that window's own start,
# so the pin is re-derived rather than guessed, and drift shows up as the ratio
# moving between readings.
#
# `usage-budget.py --burn` prints the current number. Set to 0 to disable the
# measured wave and restore the constant `degraded_workers`.
five_hour_token_ceiling = 22_600_000

[ownership]
# protocol.md §3. Paths reserved to the owner: the rules the fleet runs under,
# the scripts that enforce them, and the agent definitions that carry them.
# A supervisor that can edit its own constraints has none.
#
# Relative to doc_repo. Everything in this repo is reserved implicitly -- a leg
# never checks it out.
reserved = [
  "DOC-PROTOCOL.md",
  "DOC-COMPACTION.md",
  # DOC-COMPACTION.md §6-§9 became its own doc on 2026-09-04 when that file
  # reached its cap. Reserved for the same reason its parent is: it is a rule
  # the fleet runs under. This is the "next split is loud" case protocol.md §3
  # predicted -- check-ownership.py --supervisor failed until it was listed.
  "DOC-COMPACTION-PASS.md",
  # DOC-COMPACTION.md §2 became its own doc on 2026-09-07 when adding the debt
  # ledger and the per-decision cap took that file into reserve. Reserved for
  # the same reason its parent is: it is a rule the fleet runs under, and it is
  # the one a worker would most like to edit -- it defines the caps.
  "DOC-BUDGET.md",
  # DOC-PROTOCOL.md §7 became its own doc the same day, same reason.
  "DOC-CONVENTIONS.md",
  # The method for the suite review pass (`/suite-review`). Reserved because it
  # is a rule the owner's own session runs under and because the pass it defines
  # reads every reserved path in this list -- a doc a worker could edit is a doc
  # that could aim the pass, or blunt it.
  "SUITE-REVIEW-PASS.md",
  "embarch-dev-workflow.md",
  "CLAUDE.md",
  # scripts/ -- the WHOLE directory. Re-examined 2026-09-06 against the backlog
  # it generates rather than defended on principle, and left unchanged.
  #
  # The question was whether an assembler like `build_changelog.py` is the
  # fleet's constraint or a utility that happens to share a directory. It is not
  # a mixed directory. All 19 scripts are one of three things, and none of them
  # is a utility:
  #
  #   8  GENERATED SHIMS whose implementation lives in this repo, which no leg
  #      checks out (check-client-names, check-dispatch, check-ownership,
  #      fleet-alert, fold-commit, fold-day, queue-status, usage-budget). A
  #      hand-edit there is reverted by the next install and caught by
  #      `install.py --verify`, so they are already doubly reserved.
  #
  #   9  THE MERGE GATE ITSELF, or its runner -- check-docs.py's ten checks.
  #      `build_changelog.py` and `build_features.py` are in this class, not
  #      outside it: their `--check` arms ARE two of the ten, the supervisor
  #      runs both at every fold, and `fold-commit.py` refuses a fold that shows
  #      the signature of build_changelog having been run wrong. A leg editing
  #      any of them is editing its own gate, which is the stated hazard.
  #
  #   2  WORK DISCOVERY. `collect-open-questions.py` is what a leg sweeps at
  #      refill to decide what work exists (leg.md step 1);
  #      `check-duplication.py` feeds the auditor that files inbox drops. These
  #      are not gates and they are the more insidious case for it: a gate
  #      failure is loud, a refill blind spot is silent. tasks/doc/003 was
  #      exactly that -- collect-open-questions reporting nothing from three
  #      sub-projects, so the fleet could not see work that existed.
  #
  # MEASURED AGAINST THE BACKLOG, which is the only argument for narrowing: of
  # the 22 tasks/doc items filed 2026-09-04 19:46 to 09-06 18:38, narrowing to
  # "the gate only" would have made ZERO of them dispatchable to a leg. Roughly
  # half named a script, and nearly every one of those named a gate check. The
  # duty cycle -- 13 of 21 closed in one 90-minute owner burst on 09-06 -- is a
  # cost, not a refutation. The lever on it is fill rate, not the map.
  #
  # THE DIRECTORY PREFIX IS ALSO THE PROPERTY THAT SURVIVES A FILE SPLIT. A new
  # script is reserved on creation; a per-file allowlist inverts that default,
  # which is the failure that already happened once (2026-09-04: reserved
  # content stopped being reserved purely by MOVING, and nothing noticed for a
  # day). It also covers `doc-size-baseline.json`, which is not a script at all
  # -- it is the size ratchet's state, and a leg that could edit it could raise
  # its own caps. A `*.py` allowlist would have missed that file entirely.
  #
  # THE MIDDLE PATH WAS CONSIDERED AND DECLINED. ops.md §4's announce-and-park
  # takes silence as consent, and an owner asleep at 03:00 is silence -- that is
  # the exact failure the map exists to prevent, so it is wrong for a reserved
  # path even though it is right for a merely risky one. An explicit "leg
  # proposes a diff, owner approves" flow is safe, but it relocates the owner's
  # work rather than reducing it: reviewing a change to the gate you rely on
  # needs the same understanding as writing it. And a leg proposing a change to
  # `check-ownership.py` must run its own gate under either the old script (the
  # proposal is untested) or the new one (the leg ran under its own proposed
  # constraints). Both are wrong, and neither is worth building for zero tasks.
  #
  # REVERSAL CONDITION: revisit when a genuine utility tier appears -- 5 or more
  # scripts here that are none of the three classes above -- AND a rolling
  # 20-task tasks/doc window lands 25% or more of its work only on those. The
  # design then is an EXCEPTION list that `check-ownership.py --supervisor`
  # requires be exhaustive over `scripts/`, the way it already is over top-level
  # docs, so a new script is still unclassified until someone classifies it.
  # Never a plain narrowing, which gives the split hazard back.
  "scripts/",
  ".claude/",
  # Written by deploy.py: which framework version rendered this instance.
  # A leg must not touch it -- it is a fact about the install, and
  # `git log .fleet-version` in the instance is the deploy history.
  ".fleet-version",
  # Protocol READMEs. Each documents a rule the fleet runs under while sitting
  # inside a directory the fleet legitimately writes, so naming the directory is
  # not enough -- tasks/README.md carries the claim and staleness protocol that
  # queue-status.py implements, and a leg editing it would be editing its own
  # dispatch predicate. install.py owns these files; edit them here.
  "tasks/README.md",
  "inbox/README.md",
  "changelog.d/README.md",
  "status.d/README.md",
  # The suite-level view of this repo, added 2026-09-05 because DOC-PROTOCOL.md
  # §3 gives every sub-project a directory and the fleet had none. Reserved on
  # sight: creating `embarch-doc/embarch-fleet/` also creates a `fleet` WORKER
  # scope, and check-ownership.py's worker rule grants `embarch-<scope>/**`, so
  # without this the directory split that exists to keep a leg away from its own
  # rules would have handed one a door back in. check-ownership.py also refuses
  # `fleet` as a worker scope outright, the way it refuses `suite`; this entry is
  # the supervisor half of the same rule.
  "embarch-fleet/",
  "tasks/fleet/",
]

# Top-level docs in doc_repo the fleet legitimately writes. This list exists so
# that reserved plus this one is EXHAUSTIVE over tracked top-level *.md: a new
# top-level doc -- written fresh, or split out when one hits its size cap -- is
# unclassified until a human puts it in a list, and that is exactly the moment
# to decide which. Reserved content stopped being reserved purely by moving
# once already, and nothing noticed for a day.
fleet_writable = [
  "README.md",
  "embarch.md",
  "embarch-decision-reversals.md",
  "embarch-glossary.md",
  "embarch-remote-surfaces.md",
  "embarch-stream-pipeline-proposal.md",
  "embarch-token.md",
  "embarch-zephyr.md",
]
